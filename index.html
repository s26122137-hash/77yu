  <title>My Portfolio - 作品集闖關地圖</title>

  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #fff0f3 0%, #fce7f3 40%, #f3e8ff 100%);
      --pink-soft: #fbcfe8;
      --pink-main: #f472b6;
      --pink-deep: #ec4899;
      --pink-accent: #db2777;
      --text-dark: #831843;
      --text-muted: #9d174d;
      --card-bg: rgba(255, 255, 255, 0.82);
      --card-border: rgba(251, 207, 232, 0.8);
      --locked-bg: rgba(243, 244, 246, 0.75);
      --locked-border: #e5e7eb;
    }

    body {
      font-family: 'Fredoka', 'Noto Sans TC', sans-serif;
      background: var(--bg-gradient);
      color: var(--text-dark);
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    .bg-particle {
      position: fixed;
      pointer-events: none;
      animation: floatUp 9s infinite linear;
      opacity: 0;
      z-index: 0;
    }

    @keyframes floatUp {
      0% {
        transform: translateY(105vh) rotate(0deg) scale(0.8);
        opacity: 0;
      }
      20% {
        opacity: 0.6;
      }
      80% {
        opacity: 0.6;
      }
      100% {
        transform: translateY(-10vh) rotate(360deg) scale(1.2);
        opacity: 0;
      }
    }

    .profile-card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border: 3px solid rgba(255, 255, 255, 0.95);
      box-shadow: 0 16px 36px -10px rgba(244, 114, 182, 0.22),
                  0 0 20px rgba(236, 72, 153, 0.08) inset;
    }

    .avatar-halo {
      position: relative;
    }

    .avatar-halo::before {
      content: '';
      position: absolute;
      inset: -5px;
      border-radius: 9999px;
      background: linear-gradient(45deg, #f472b6, #e9d5ff, #ec4899, #fbcfe8);
      background-size: 200% 200%;
      z-index: -1;
      animation: gradientGlow 5s ease infinite;
    }

    @keyframes gradientGlow {
      0% { background-position: 0% 50%; filter: blur(6px); }
      50% { background-position: 100% 50%; filter: blur(9px); }
      100% { background-position: 0% 50%; filter: blur(6px); }
    }

    .level-unlocked {
      background: linear-gradient(135deg, #ffffff 0%, #fff1f2 100%);
      border: 2px solid var(--card-border);
      box-shadow: 0 8px 20px rgba(244, 114, 182, 0.12);
      transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
      position: relative;
      overflow: hidden;
    }

    .level-unlocked::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: linear-gradient(
        60deg,
        transparent 30%,
        rgba(255, 255, 255, 0.8) 50%,
        transparent 70%
      );
      transform: rotate(30deg) translateX(-100%);
      transition: transform 0.65s ease-in-out;
    }

    .level-unlocked:hover::before {
      transform: rotate(30deg) translateX(100%);
    }

    .level-unlocked:hover {
      transform: translateY(-8px) scale(1.03);
      border-color: var(--pink-main);
      box-shadow: 0 16px 32px rgba(244, 114, 182, 0.28),
                  0 0 15px rgba(236, 72, 153, 0.15);
    }

    .level-locked {
      background: var(--locked-bg);
      border: 2px dashed var(--locked-border);
      backdrop-filter: blur(6px);
      transition: all 0.25s ease;
      cursor: pointer;
    }

    .level-locked:hover {
      background: rgba(243, 244, 246, 0.92);
      border-color: var(--pink-soft);
      transform: translateY(-3px);
    }

    .level-locked:hover .lock-icon {
      transform: scale(1.25) rotate(-12deg);
      transition: transform 0.25s ease;
    }
