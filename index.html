<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Web Portfolio - 貓咪主題作品集闖關地圖</title>
  
  <!-- 載入 Google Fonts: Fredoka & Noto Sans TC -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #fff0f3 0%, #fce7f3 40%, #f3e8ff 100%);
      --pink-soft: #fbcfe8;
      --pink-main: #f472b6;
      --pink-deep: #ec4899;
      --pink-accent: #db2777;
      --text-dark: #831843;
      --card-bg: rgba(255, 255, 255, 0.85);
      --card-border: rgba(251, 207, 232, 0.85);
    }

    body {
      font-family: 'Fredoka', 'Noto Sans TC', sans-serif;
      background: var(--bg-gradient);
      color: var(--text-dark);
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    .bg-particle {
      position: fixed;
      pointer-events: none;
      animation: floatUp 8s infinite linear;
      opacity: 0;
      z-index: 0;
    }

    @keyframes floatUp {
      0% {
        transform: translateY(105vh) rotate(0deg) scale(0.8);
        opacity: 0;
      }
      20% {
        opacity: 0.65;
      }
      80% {
        opacity: 0.65;
      }
      100% {
        transform: translateY(-10vh) rotate(360deg) scale(1.2);
        opacity: 0;
      }
    }

    .profile-card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border: 3px solid rgba(255, 255, 255, 0.95);
      box-shadow: 0 16px 36px -10px rgba(244, 114, 182, 0.22),
                  0 0 20px rgba(236, 72, 153, 0.08) inset;
    }

    .avatar-halo {
      position: relative;
    }

    .avatar-halo::before {
      content: '';
      position: absolute;
      inset: -6px;
      border-radius: 9999px;
      background: linear-gradient(45deg, #f472b6, #e9d5ff, #ec4899, #fbcfe8);
      background-size: 200% 200%;
      z-index: -1;
      animation: gradientGlow 4s ease infinite;
    }

    @keyframes gradientGlow {
      0% { background-position: 0% 50%; filter: blur(6px); }
      50% { background-position: 100% 50%; filter: blur(10px); }
      100% { background-position: 0% 50%; filter: blur(6px); }
    }

    .level-unlocked {
      background: linear-gradient(135deg, #ffffff 0%, #fff1f2 100%);
      border: 2px solid var(--card-border);
      box-shadow: 0 8px 20px rgba(244, 114, 182, 0.12);
      transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
      position: relative;
      overflow: hidden;
    }

    /* 光線掃過 hover 特效 */
    .level-unlocked::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: linear-gradient(
        60deg,
        transparent 30%,
        rgba(255, 255, 255, 0.85) 50%,
        transparent 70%
      );
      transform: rotate(30deg) translateX(-100%);
      transition: transform 0.65s ease-in-out;
    }

    .level-unlocked:hover::before {
      transform: rotate(30deg) translateX(100%);
    }

    .level-unlocked:hover {
      transform: translateY(-8px) scale(1.03);
      border-color: var(--pink-main);
      box-shadow: 0 16px 32px rgba(244, 114, 182, 0.28),
                  0 0 15px rgba(236, 72, 153, 0.15);
    }
  </style>
</head>
<body class="flex flex-col min-h-screen items-center justify-between p-4 md:p-8">

  <!-- 背景飄浮顆粒容器 -->
  <div id="particles-container"></div>

  <main class="w-full max-w-5xl mx-auto z-10 flex flex-col items-center gap-8">

    <!-- 1. 中央個人資訊區 (Cat Profile Card) -->
    <header class="profile-card w-full max-w-lg rounded-3xl p-6 md:p-8 text-center flex flex-col items-center gap-4 mt-2">
      <!-- 貓咪大頭貼 -->
      <div class="avatar-halo w-28 h-28 md:w-32 md:h-32 rounded-full">
        <img 
          src="https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?auto=format&fit=crop&w=400&q=80" 
          alt="Cute Cat Avatar" 
          class="w-full h-full object-cover rounded-full border-4 border-white shadow-md"
          onerror="this.src='https://placehold.co/150x150/fbcfe8/831843?text=🐱+Cat'"
        >
      </div>

      <!-- 姓名與標題 -->
      <div class="space-y-1.5">
        <div class="inline-flex items-center gap-1.5 px-3 py-1 bg-pink-100 text-pink-700 text-xs font-semibold rounded-full">
          <span>🐾</span>
          <span>Web Developer Portfolio</span>
        </div>
        <h1 class="text-2xl md:text-3xl font-bold tracking-wide text-pink-950">我的作品集 / My Portfolio</h1>
        <p class="text-xs md:text-sm text-pink-800/80 font-medium">恭喜全關卡解鎖！盡情探索貓咪主題作品集吧 🎉</p>
      </div>

      <!-- 解鎖進度條 (全解鎖 16 / 16 = 100%) -->
      <div class="w-full bg-pink-100/80 rounded-full h-3.5 p-0.5 border border-pink-200/80 mt-1">
        <div class="bg-gradient-to-r from-pink-400 to-pink-500 h-full rounded-full w-full transition-all duration-500 shadow-sm"></div>
      </div>
      <div class="text-xs text-pink-700 font-semibold flex justify-between w-full px-1">
        <span>關卡進度：16 / 16 全數解鎖 ✨</span>
        <span>100%</span>
      </div>
    </header>

    <!-- 2. 16 個已解鎖闖關按鈕網格 -->
    <section class="w-full">
      <div id="levels-grid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3.5 md:gap-5 w-full">
      </div>
    </section>

    <!-- 頁尾 -->
    <footer class="text-center text-xs text-pink-800/60 pb-2 mt-2">
      <p>© 2026 My Web Portfolio • Designed with 💕 and 🐾</p>
    </footer>
  </main>

  <script>
    // 1. 完整 16 週關卡資料
    const levelsData = [
      { week: 1,  title: "數位名片",     icon: "📇" },
      { week: 2,  title: "今天吃甚麼?",  icon: "🍱" },
      { week: 3,  title: "迷因產生器",   icon: "🤣" },
      { week: 4,  title: "悄悄話",       icon: "💌" },
      { week: 5,  title: "默契大考驗",   icon: "🎯" },
      { week: 6,  title: "互動小遊戲",   icon: "🎮" },
      { week: 7,  title: "API 數據串接", icon: "🔌" },
      { week: 8,  title: "天氣 App",     icon: "🌤️" },
      { week: 9,  title: "待辦事項清單", icon: "✅" },
      { week: 10, title: "音樂播放器",   icon: "🎧" },
      { week: 11, title: "電商購物車",   icon: "🛒" },
      { week: 12, title: "Canvas 畫板",  icon: "🎨" },
      { week: 13, title: "3D 視覺體驗",  icon: "🧊" },
      { week: 14, title: "個人部落格",   icon: "✍️" },
      { week: 15, title: "團隊專題展示", icon: "🤝" },
      { week: 16, title: "期末總結作品", icon: "🏆" }
    ];

    // 2. 渲染所有已解鎖關卡卡片
    function renderLevels() {
      const grid = document.getElementById('levels-grid');
      grid.innerHTML = levelsData.map(item => {
        const weekLabel = item.week < 10 ? `0${item.week}` : item.week;
        return `
          <a href="w${item.week}/index.html" class="level-unlocked p-4 md:p-5 rounded-2xl flex flex-col justify-between h-32 md:h-36 text-left group">
            <div class="flex justify-between items-start">
              <span class="text-xs font-bold uppercase tracking-wider text-pink-600 bg-pink-100 px-2.5 py-0.5 rounded-md">Week ${weekLabel}</span>
              <span class="text-xl group-hover:scale-125 transition-transform">${item.icon}</span>
            </div>
            <div>
              <h3 class="font-bold text-sm md:text-base text-pink-950 line-clamp-2">Week ${item.week} - ${item.title}</h3>
              <p class="text-xs text-pink-500 mt-1 flex items-center gap-1 font-medium">
                <span>進入關卡</span>
                <span class="group-hover:translate-x-1 transition-transform">→</span>
              </p>
            </div>
          </a>
        `;
      }).join('');
    }

    // 3. 生成飄浮粉紅愛心、星芒與貓爪
    function initParticles() {
      const container = document.getElementById('particles-container');
      const symbols = ['🌸', '💖', '✨', '⭐', '🐾', '💕', '🍬'];
      const particleCount = 16;

      for (let i = 0; i < particleCount; i++) {
        const particle = document.createElement('div');
        particle.className = 'bg-particle';
        particle.innerText = symbols[Math.floor(Math.random() * symbols.length)];
        particle.style.left = `${Math.random() * 100}vw`;
        particle.style.animationDuration = `${7 + Math.random() * 6}s`;
        particle.style.animationDelay = `${Math.random() * 6}s`;
        particle.style.fontSize = `${14 + Math.random() * 14}px`;
        container.appendChild(particle);
      }
    }

    window.onload = function() {
      renderLevels();
      initParticles();
    };
  </script>
</body>
</html>
