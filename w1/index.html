<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>77 的個人名片 🎀</title>
  
  <style>
    /* ==========================================
       全域重置與柔和漸層背景
       ========================================== */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang TC", "Microsoft JhengHei", sans-serif;
      min-height: 100vh;
      /* 夢幻馬卡龍草莓奶昔漸層 */
      background: linear-gradient(135deg, #fff0f5 0%, #ffd6e0 50%, #e8f0fe 100%);
      
      /* 全畫面置中 */
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    /* ==========================================
       Hello Kitty 卡片主體 (現代圓角 + 柔和陰影)
       ========================================== */
    .profile-card {
      position: relative;
      background-color: #ffffff;
      width: 100%;
      max-width: 330px;
      padding: 48px 28px 36px;
      border-radius: 32px;
      text-align: center;
      
      /* 高質感立體柔和陰影 */
      box-shadow: 
        0 16px 36px rgba(255, 175, 190, 0.35),
        0 6px 16px rgba(0, 0, 0, 0.03);
        
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.3s ease;
    }

    /* 滑鼠懸停微浮起懸浮效果 */
    .profile-card:hover {
      transform: translateY(-8px);
      box-shadow: 
        0 22px 42px rgba(255, 160, 180, 0.45),
        0 8px 20px rgba(0, 0, 0, 0.05);
    }

    /* ==========================================
       Hello Kitty 貓耳朵造型
       ========================================== */
    .ear {
      position: absolute;
      top: -16px;
      width: 48px;
      height: 48px;
      background-color: #ffffff;
      border-radius: 14px;
      z-index: 0;
    }

    .ear-left {
      left: 36px;
      transform: rotate(-15deg);
      box-shadow: -3px -3px 8px rgba(255, 182, 193, 0.2);
    }

    .ear-right {
      right: 36px;
      transform: rotate(15deg);
      box-shadow: 3px -3px 8px rgba(255, 182, 193, 0.2);
    }

    /* ==========================================
       Hello Kitty 經典蝴蝶結
       ========================================== */
    .bow {
      position: absolute;
      top: -12px;
      right: 42px;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .bow-center {
      width: 15px;
      height: 15px;
      background-color: #ff4d6d;
      border-radius: 50%;
      z-index: 2;
      box-shadow: 0 2px 6px rgba(255, 77, 109, 0.4);
    }

    .bow-left, .bow-right {
      width: 22px;
      height: 17px;
      background-color: #ff4d6d;
      border-radius: 8px;
    }

    .bow-left {
      margin-right: -4px;
      transform: rotate(-12deg);
    }

    .bow-right {
      margin-left: -4px;
      transform: rotate(12deg);
    }

    /* ==========================================
       圓形大頭貼
       ========================================== */
    .avatar-container {
      position: relative;
      z-index: 1;
      margin-bottom: 16px;
      display: inline-block;
    }

    .avatar {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      object-fit: cover;
      /* 奶油粉色甜美外邊框 */
      border: 4px solid #fff0f3;
      box-shadow: 0 8px 20px rgba(255, 154, 162, 0.35);
    }

    /* ==========================================
       名字與自我介紹
       ========================================== */
    .name {
      font-size: 1.6rem;
      color: #4a3e3d;
      font-weight: 700;
      margin-bottom: 8px;
      letter-spacing: 1px;
    }

    .bio {
      font-size: 0.95rem;
      color: #8c7a7a;
      line-height: 1.5;
      margin-bottom: 28px;
    }

    /* ==========================================
       按鈕區塊 (Instagram & Email)
       ========================================== */
    .button-group {
      display: flex;
      gap: 12px;
    }

    .btn {
      flex: 1;
      padding: 12px 0;
      border-radius: 50px;
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 600;
      transition: all 0.25s ease;
      display: inline-block;
    }

    /* Instagram 按鈕：草莓粉色 */
    .btn-ig {
      background-color: #ff85a1;
      color: #ffffff;
      box-shadow: 0 4px 14px rgba(255, 133, 161, 0.4);
    }

    .btn-ig:hover {
      background-color: #ff6b8b;
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(255, 133, 161, 0.6);
    }

    .btn-email {
      background-color: #b8e2f2;
      color: #2b5366;
      box-shadow: 0 4px 14px rgba(184, 226, 242, 0.5);
    }
