<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>個人名片 | 鳴子</title>

  <style>
    /* ==========================================
       1. 全域重置與馬卡龍粉柔漸層背景
       ========================================== */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang TC", "Microsoft JhengHei", sans-serif;
      min-height: 100vh;
      /* 馬卡龍柔和粉藍與草莓粉漸層背景 */
      background: linear-gradient(135deg, #fff0f5 0%, #ffd6e0 50%, #e8f0fe 100%);
      
      /* 將卡片在螢幕正中央置中 */
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    /* ==========================================
       2. 名片主體 (現代大圓角 + 微陰影)
       ========================================== */
    .profile-card {
      background-color: #ffffff;
      width: 100%;
      max-width: 330px;
      padding: 40px 28px 32px;
      border-radius: 28px;
      text-align: center;
      
      /* 馬卡龍柔和微陰影 (Soft Shadow) */
      box-shadow: 
        0 12px 30px rgba(235, 180, 200, 0.3),
        0 4px 12px rgba(180, 200, 230, 0.15);
        
      /* 平滑懸浮效果 */
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    /* 當滑鼠懸停時卡片微微浮起 */
    .profile-card:hover {
      transform: translateY(-6px);
      box-shadow: 
        0 18px 36px rgba(235, 180, 200, 0.4),
        0 6px 16px rgba(180, 200, 230, 0.2);
    }

    /* ==========================================
       3. 圓形大頭貼
       ========================================== */
    .avatar-container {
      margin-bottom: 18px;
      display: inline-block;
    }

    .avatar {
      width: 110px;
      height: 110px;
      border-radius: 50%; /* 完美圓形 */
      object-fit: cover;
      /* 奶油淡黃色邊框與柔和陰影 */
      border: 4px solid #fff5db;
      box-shadow: 0 6px 16px rgba(255, 210, 180, 0.4);
    }

    /* ==========================================
       4. 名字與一行簡短自我介紹
       ========================================== */
    .name {
      font-size: 1.5rem;
      color: #4a4254; /* 高雅紫灰色 */
      font-weight: 700;
      margin-bottom: 8px;
      letter-spacing: 1px;
    }

    .bio {
      font-size: 0.9rem;
      color: #7d7385;
      line-height: 1.5;
      margin-bottom: 28px;
      white-space: nowrap; /* 保持一行單行自我介紹 */
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ==========================================
       5. 按鈕區塊 (Instagram & Email)
       ========================================== */
    .button-group {
      display: flex;
      gap: 12px;
    }

    .btn {
      flex: 1;
      padding: 12px 0;
      border-radius: 50px; /* 現代感膠囊圓角 */
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 600;
      transition: all 0.25s ease;
      display: inline-block;
    }

    /* Instagram 按鈕：蜜桃粉色 */
    .btn-ig {
      background-color: #ffc2d1;
      color: #5c2838;
      box-shadow: 0 4px 12px rgba(255, 194, 209, 0.5);
    }

    .btn-ig:hover {
      background-color: #ffb3c6;
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(255, 194, 209, 0.7);
    }

    /* Email 按鈕：馬卡龍淡藍色 */
    .btn-email {
      background-color: #b8e2f2;
      color: #204759;
      box-shadow: 0 4px 12px rgba(184, 226, 242, 0.5);
    }

    .btn-email:hover {
      background-color: #a6d9ec;
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(184, 226, 242, 0.7);
    }
  </style>
</head>
<body>

  <!-- 個人名片主卡片 -->
  <div class="profile-card">
    
    <!-- 1. 圓形大頭貼 -->
    <div class="avatar-container">
      <img src="https://i.postimg.cc/kG8bb4t0/77da-mei-zhao.jpg" alt="鳴子的大頭貼" class="avatar">
    </div>

    <!-- 2. 名字與一行簡短自我介紹 -->
    <h1 class="name">77</h1>
    <p class="bio">777🌸</p>

    <!-- 3. 按鈕區塊 (Instagram & Email) -->
    <div class="button-group">
      <a href="https://instagram.com" target="_blank" class="btn btn-ig">Instagram</a>
      <a href="mailto:s26122137@stu.edu.tw" class="btn btn-email">Email</a>
    </div>

  </div>

</body>
</html>
