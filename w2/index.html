<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>今天吃什麼？隨機抽籤機</title>

  <style>
    /* ==========================================
       1. 全域重置與馬卡龍漸層背景
       ========================================== */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang TC", "Microsoft JhengHei", sans-serif;
      min-height: 100vh;
      /* 馬卡龍柔和粉藍/粉紫漸層 */
      background: linear-gradient(135deg, #fff0f5 0%, #ffd6e0 50%, #e8f0fe 100%);
      
      /* 全畫面置中 */
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    /* ==========================================
       2. 卡片主體 (現代圓角 + 柔和陰影)
       ========================================== */
    .card {
      background-color: #ffffff;
      width: 100%;
      max-width: 360px;
      padding: 32px 24px;
      border-radius: 32px;
      text-align: center;
      
      /* 馬卡龍柔和層次陰影 */
      box-shadow: 
        0 16px 36px rgba(255, 175, 190, 0.35),
        0 6px 16px rgba(0, 0, 0, 0.03);
        
      transition: transform 0.3s ease;
    }

    .card:hover {
      transform: translateY(-4px);
    }

    /* ==========================================
       3. 美食照片容器
       ========================================== */
    .image-box {
      width: 100%;
      height: 200px;
      border-radius: 20px;
      overflow: hidden;
      margin-bottom: 24px;
      border: 4px solid #fff0f3;
      box-shadow: 0 8px 20px rgba(255, 154, 162, 0.3);
    }

    .image-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: opacity 0.3s ease;
    }

    /* ==========================================
       4. 大標題與動態彈跳效果
       ========================================== */
    .title {
      font-size: 1.6rem;
      color: #4a3e3d;
      font-weight: 700;
      margin-bottom: 24px;
      min-height: 2.2rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* 生動彈跳動畫 (Pop-in) */
    .bounce {
      animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes popIn {
      0% {
        transform: scale(0.5);
        opacity: 0;
      }
      70% {
        transform: scale(1.15);
      }
      100% {
        transform: scale(1);
        opacity: 1;
      }
    }

    /* ==========================================
       5. 按鈕區塊 (馬卡龍色系)
       ========================================== */
    .btn {
      width: 100%;
      padding: 14px 0;
      border: none;
      border-radius: 50px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
      transition: all 0.25s ease;
      box-sizing: border-box;
    }

    /* 點我抽籤按鈕：馬卡龍蜜桃粉 */
    .btn-draw {
      background-color: #ff85a1;
      color: #ffffff;
      box-shadow: 0 4px 14px rgba(255, 133, 161, 0.4);
    }

    .btn-draw:hover {
      background-color: #ff6b8b;
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(255, 133, 161, 0.6);
    }

    .btn-draw:active {
      transform: translateY(0);
    }

    /* 馬上出發按鈕：馬卡龍天藍色 */
    .btn-map {
      background-color: #a2d2ff;
      color: #1d3557;
      margin-top: 12px;
      box-shadow: 0 4px 14px rgba(162, 210, 255, 0.5);
    }

    .btn-map:hover {
      background-color: #8ecaef;
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(162, 210, 255, 0.7);
    }

    /* 控制顯示隱藏 */
    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <!-- 卡片主體 -->
  <main class="card">
    
    <!-- 美食照片容器 -->
    <div class="image-box">
      <img id="food-image" src="https://images.unsplash.com/photo-1504674900247-0877df9cc836?auto=format&fit=crop&w=600&q=80" alt="美食照片">
    </div>

    <!-- 1. 大標題 -->
    <h1 id="title" class="title">今天吃什麼？</h1>
    
    <!-- 2. 抽籤大按鈕 -->
    <button id="draw-btn" class="btn btn-draw">點我抽籤 🎲</button>

    <!-- 3. 馬上出發 GOOGLE MAP 按鈕 (預設隱藏，抽中後顯示) -->
    <a id="map-btn" href="#" target="_blank" class="btn btn-map hidden">馬上出發 📍</a>

  </main>

  <script>
    // 確保網頁元件完全載入後才執行邏輯
    document.addEventListener('DOMContentLoaded', () => {
      
      // 美食選項資料（名稱、照片網址、Google Maps 搜尋連結）
      const foodList = [
        {
          name: "瓦城 🍛",
          image: "https://images.unsplash.com/photo-1559847844-5315695dadae?auto=format&fit=crop&w=600&q=80",
          mapUrl: "https://www.google.com/maps/search/瓦城"
        },
        {
          name: "好正點 🥟",
          image: "https://images.unsplash.com/photo-1563245372-f21724e3856d?auto=format&fit=crop&w=600&q=80",
          mapUrl: "https://www.google.com/maps/search/好正點"
        },
        {
          name: "金色三麥 🍺",
          image: "https://images.unsplash.com/photo-1514933651103-005eec06c04b?auto=format&fit=crop&w=600&q=80",
          mapUrl: "https://www.google.com/maps/search/金色三麥"
        },
        {
          name: "燒肉 🥩",
          image: "https://images.unsplash.com/photo-1544025162-d76694265947?auto=format&fit=crop&w=600&q=80",
          mapUrl: "https://www.google.com/maps/search/燒肉"
        },
        {
          name: "火鍋 🍲",
          image: "https://images.unsplash.com/photo-1555126634-323283e090fa?auto=format&fit=crop&w=600&q=80",
          mapUrl: "https://www.google.com/maps/search/火鍋"
        }
      ];

      // 取得 HTML 畫面上的元素
      const title = document.getElementById('title');
      const foodImage = document.getElementById('food-image');
      const drawBtn = document.getElementById('draw-btn');
      const mapBtn = document.getElementById('map-btn');

      // 點擊按鈕觸發抽籤
      drawBtn.addEventListener('click', () => {
        // 從選單中隨機抽取一項
        const randomIndex = Math.floor(Math.random() * foodList.length);
        const selectedFood = foodList[randomIndex];

        // 移除動畫類別以重置動畫
        title.classList.remove('bounce');
        mapBtn.classList.remove('bounce');
        
        // 觸發重繪 (Reflow)，讓動畫可以重複播放
        void title.offsetWidth;

        // 替換標題文字並加上生動彈跳動畫
        title.textContent = selectedFood.name;
        title.classList.add('bounce');

        // 替換美食照片
        foodImage.src = selectedFood.image;

        // 設定地圖連結並顯示「馬上出發」按鈕
        mapBtn.href = selectedFood.mapUrl;
        mapBtn.classList.remove('hidden');
        mapBtn.classList.add('bounce');
      });

    });
  </script>
</body>
</html>
