<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>粉白貓咪動態留言板 🐾</title>
  
  <!-- 引入 Google Fonts 可愛圓潤字體 (Nunito & Zen Maru Gothic) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800&family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">

  <style>
    /* ==========================================================================
       【主題顏色設定區】 - 方便你後續調整顏色風格
       ========================================================================== */
    :root {
      /* 主視覺顏色 */
      --bg-color: #FFF5F7;          /* 網頁背景色：極淺粉白 */
      --card-bg: #FFFFFF;          /* 卡片背景色：純白 */
      --primary-color: #FF8ACE;     /* 主色調：貓咪掌心粉 */
      --secondary-color: #FFB7C5;   /* 輔助色：櫻花淺粉 */
      --accent-color: #FF529A;      /* 強調色：鮮豔亮粉（用於高亮與重點） */
      --text-dark: #5A4A42;         /* 主要文字色：深奶茶棕（比純黑更溫柔） */
      --text-muted: #A3938B;        /* 次要文字色：淺灰棕 */
      --shadow-color: rgba(255, 138, 206, 0.25); /* 柔和粉色陰影 */

      /* 輪播高亮效果控制 */
      --highlight-scale: 1.05;      /* 被選中卡片放大的比例 (1.05 = 放大5%) */
      --blur-amount: 3px;           /* 未選中卡片的模糊程度 */
    }

    /* 全局樣式重置 */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Zen Maru Gothic', 'Nunito', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-dark);
      padding: 20px;
      min-height: 100vh;
      /* 背景加上可愛的可愛貓咪爪印與點點圖案 */
      background-image: 
        radial-gradient(var(--secondary-color) 15%, transparent 16%),
        radial-gradient(var(--secondary-color) 15%, transparent 16%);
      background-size: 60px 60px;
      background-position: 0 0, 30px 30px;
      background-opacity: 0.3;
    }

    /* 頁頭標題區 */
    header {
      text-align: center;
      margin-bottom: 30px;
      position: relative;
    }

    header h1 {
      font-size: 2.2rem;
      color: var(--accent-color);
      display: inline-block;
      position: relative;
      background: #FFFFFF;
      padding: 10px 30px;
      border-radius: 30px;
      box-shadow: 0 8px 20px var(--shadow-color);
      border: 3px solid var(--secondary-color);
    }

    /* 標題貓耳可愛裝飾 */
    header h1::before, header h1::after {
      content: '';
      position: absolute;
      top: -15px;
      width: 0;
      height: 0;
      border-left: 15px solid transparent;
      border-right: 15px solid transparent;
      border-bottom: 20px solid var(--secondary-color);
    }
    header h1::before { left: 20px; transform: rotate(-20deg); }
    header h1::after { right: 20px; transform: rotate(20deg); }

    header p {
      margin-top: 12px;
      color: var(--text-muted);
      font-size: 1rem;
    }

    /* ==========================================================================
       【酷炫貓咪載入中動畫 (Loading Animation)】
       ========================================================================== */
    #loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 80px 0;
    }

    /* 旋轉貓爪 Loading Circle */
    .cat-spinner {
      width: 70px;
      height: 70px;
      border: 6px solid var(--secondary-color);
      border-top: 6px solid var(--accent-color);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      position: relative;
      margin-bottom: 20px;
    }

    .cat-spinner::after {
      content: '🐾';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 24px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    #loading p {
      font-size: 1.2rem;
      font-weight: bold;
      color: var(--accent-color);
      letter-spacing: 2px;
      animation: pulse 1.5s infinite ease-in-out;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 1; }
    }

    /* ==========================================================================
       【瀑布流排版區 (Masonry Layout)】
       ========================================================================== */
    .masonry-container {
      /* RWD 響應式欄數設定 */
      column-count: 4;          /* 電腦大螢幕：4 欄 */
      column-gap: 20px;         /* 欄與欄的間距 */
      max-width: 1200px;
      margin: 0 auto;
    }

    /* 螢幕寬度調小時自動減少欄數 */
    @media (max-width: 1024px) { .masonry-container { column-count: 3; } }
    @media (max-width: 768px)  { .masonry-container { column-count: 2; } }
    @media (max-width: 480px)  { .masonry-container { column-count: 1; } }

    /* ==========================================================================
       【留言卡片基礎樣式與高亮特效】
       ========================================================================== */
    .card {
      background-color: var(--card-bg);
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 20px;      /* 卡片上下間距 */
      break-inside: avoid;      /* 防止瀑布流卡片被截斷拆成兩半 */
      border: 2px solid #FFE4EC;
      box-shadow: 0 5px 15px rgba(0,0,0,0.03);
      position: relative;
      transition: all 0.6s cubic-bezier(0.25, 1, 0.5, 1); /* 轉場平滑效果 */
      cursor: pointer;
    }

    /* 貓咪小貼紙標籤 */
    .card::before {
      content: '🐾';
      position: absolute;
      top: -10px;
      right: 15px;
      font-size: 18px;
      background: var(--bg-color);
      padding: 2px 6px;
      border-radius: 10px;
      border: 1px solid var(--secondary-color);
    }

    /* 卡片頭像與名字 */
    .card-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
      border-bottom: 1px dashed #FFD1DC;
      padding-bottom: 8px;
    }

    .avatar {
      width: 36px;
      height: 36px;
      background-color: var(--secondary-color);
      color: white;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 1.1rem;
    }

    .card-name {
      font-weight: 700;
      color: var(--accent-color);
      font-size: 1.05rem;
    }

    /* 留言時間 */
    .card-time {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    /* 留言內容 */
    .card-content {
      font-size: 0.95rem;
      line-height: 1.6;
      color: var(--text-dark);
      white-space: pre-wrap;     /* 保留換行符號 */
      word-break: break-word;    /* 長字串自動折行 */
    }

    /* --------------------------------------------------------------------------
       【焦點輪播狀態效果 (Focus Status Controls)】
       -------------------------------------------------------------------------- */
    
    /* 1. 當前『被選中 (Highlighted)』的卡片發光與放大效果 */
    .card.highlight {
      transform: scale(var(--highlight-scale));
      border: 3px solid var(--accent-color);
      box-shadow: 0 12px 30px var(--shadow-color), 0 0 15px rgba(255, 82, 154, 0.4);
      z-index: 10;               /* 確保放大時排在最上層 */
      opacity: 1;
      filter: blur(0px);
    }

    /* 2.『未被選中 (Dimmed)』的卡片暗化與模糊效果 */
    .card.dimmed {
      opacity: 0.45;                             /* 調低透明度使卡片變暗 */
      filter: blur(var(--blur-amount));          /* 模糊效果 */
      transform: scale(0.96);                   /* 微微縮小增加對比 */
    }
  </style>
</head>
<body>

  <!-- 頁頭 -->
  <header>
    <h1>朋友對我的動態留言板</h1>
    <p>🐾 每一條留言，都是珍藏的溫暖時光 🐾</p>
  </header>

  <!-- 載入中酷炫動畫 (會在 JS 資料讀取完畢後隱藏) -->
  <div id="loading">
    <div class="cat-spinner"></div>
    <p>讀取留言中...</p>
  </div>

  <!-- 瀑布流留言牆容器 -->
  <main id="board" class="masonry-container"></main>

  <script>
    /* ==========================================================================
       【控制變數設定區】 - 方便你後續調整輪播參數
       ========================================================================== */
    const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSZ70ZsSOcXGQcBiPkY0pRgUG53MMlAxHJm-PrkhrRFVmf4lehXBNirT39zA45_MtJJqChB1uJkifuU/pub?output=csv';
    
    // 【重點設定】卡片輪播切換的秒數 (單位：毫秒，3000ms = 3 秒)
    const CAROUSEL_INTERVAL_MS = 3000; 

    // 貓咪可愛大頭照圖案清單，會隨機發給留言者
    const CAT_AVATARS = ['🐱', '😸', '😺', '😻', '😼', '😽', '🐾', '🐈'];

    // 全域變數
    let messageCards = [];     // 儲存 DOM 節點陣列
    let currentIndex = -1;     // 當前高亮的卡片索引
    let carouselTimer = null;  // 計時器物件

    /* ==========================================================================
       【主程式進入點 (Initialization)】
       ========================================================================== */
    document.addEventListener('DOMContentLoaded', () => {
      fetchMessages();
    });

    /**
     * 從 Google 試算表 CSV 抓取資料
     */
    async function fetchMessages() {
      try {
        const response = await fetch(CSV_URL);
        if (!response.ok) throw new Error('網路回應不成功');
        
        const csvText = await response.text();
        const parsedData = parseCSV(csvText);

        // 渲染卡片
        renderBoard(parsedData);

        // 隱藏 Loading 動畫
        document.getElementById('loading').style.display = 'none';

        // 開始進行焦點輪播
        if (messageCards.length > 0) {
          startCarousel();
        }

      } catch (error) {
        console.error('抓取資料失敗：', error);
        document.getElementById('loading').innerHTML = '<p style="color:red;">😿 留言讀取失敗，請稍後再試！</p>';
      }
    }

    /**
     * CSV 解析器 (妥善處理留言欄位中含有「雙引號」或「逗號」的情況)
     */
    function parseCSV(text) {
      const lines = text.trim().split('\n');
      const result = [];

      // 從第 1 行開始解析（忽略第 0 行欄位標題）
      for (let i = 1; i < lines.length; i++) {
        let line = lines[i].trim();
        if (!line) continue;

        let row = [];
        let insideQuote = false;
        let entry = '';

        for (let charIndex = 0; charIndex < line.length; charIndex++) {
          let char = line[charIndex];

          if (char === '"') {
            insideQuote = !insideQuote; // 切換雙引號狀態
          } else if (char === ',' && !insideQuote) {
            row.push(entry.trim());
            entry = '';
          } else {
            entry += char;
          }
        }
        row.push(entry.trim());

        // 假設欄位順序為：[0] 時間戳記, [1] 名字, [2] 悄悄話/留言
        if (row.length >= 3) {
          result.push({
            timestamp: row[0].replace(/^"|"$/g, ''), // 清除字串首尾雙引號
            name: row[1].replace(/^"|"$/g, '') || '匿名貓友',
            content: row[2].replace(/^"|"$/g, '')
          });
        }
      }
      return result;
    }

    /**
     * 動態生成留言卡片並放置到瀑布流牆上
     */
    function renderBoard(messages) {
      const board = document.getElementById('board');
      board.innerHTML = '';

      messages.forEach((msg) => {
        // 隨機選擇一個貓咪大頭圖示
        const randomAvatar = CAT_AVATARS[Math.floor(Math.random() * CAT_AVATARS.length)];

        // 建立卡片 HTML 結構
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <div class="card-header">
            <div class="avatar">${randomAvatar}</div>
            <div>
              <div class="card-name">${escapeHTML(msg.name)}</div>
              <div class="card-time">${escapeHTML(msg.timestamp)}</div>
            </div>
          </div>
          <div class="card-content">${escapeHTML(msg.content)}</div>
        `;

        board.appendChild(card);
      });

      // 取得所有已生成的卡片元件陣列
      messageCards = Array.from(document.querySelectorAll('.card'));
    }

    /* ==========================================================================
       【輪播特效邏輯 (Highlight Carousel)】
       ========================================================================== */
    
    /**
     * 啟動 3 秒輪播計時器
     */
    function startCarousel() {
      // 立即執行第一次高亮
      highlightNextCard();

      // 設定每隔 CAROUSEL_INTERVAL_MS 毫秒執行一次
      carouselTimer = setInterval(() => {
        highlightNextCard();
      }, CAROUSEL_INTERVAL_MS);
    }

    /**
     * 切換到下一張卡片並套用高亮 / 模糊特效
     */
    function highlightNextCard() {
      if (messageCards.length === 0) return;

      // 算下一張卡片的 index（若到盡頭則歸零重新開始）
      currentIndex = (currentIndex + 1) % messageCards.length;

      // 走訪所有卡片更新狀態
      messageCards.forEach((card, index) => {
        if (index === currentIndex) {
          // 當前卡片：加上高亮 class，移除模糊 class
          card.classList.add('highlight');
          card.classList.remove('dimmed');

          // 自動將視野平滑捲動至當前高亮的卡片（優化體驗）
          card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        } else {
          // 其他卡片：加上模糊/暗化 class，移除高亮 class
          card.classList.remove('highlight');
          card.classList.add('dimmed');
        }
      });
    }

    /**
     * 工具函式：防範 XSS 攻擊，將特殊符號轉義
     */
    function escapeHTML(str) {
      if (!str) return '';
      return str
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }
  </script>
</body>
</html>
